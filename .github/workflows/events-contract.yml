name: events contract

# Anti-drift guard for the events contract (CRM-316): the catalog is mirrored by
# the CRM and the frontend, and the schema pipe decides what the CRM may emit.
# Nothing else ran src/modules/events, so a broken mirror only showed up as 400s
# in the producer's Sidekiq log. In-process: no broker, no DB.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/modules/events/**'
      - '.github/workflows/events-contract.yml'
  push:
    branches: [main, develop]
    paths:
      - 'src/modules/events/**'
      - '.github/workflows/events-contract.yml'

jobs:
  events-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Events catalog + schema pipe specs
        run: npx jest --runInBand src/modules/events
